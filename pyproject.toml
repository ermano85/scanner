[project]
name = "qms"
version = "0.1.0"
description = "Qullamaggie swing-trade breakout scanner — nightly triage funnel over US equities and ETFs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.17",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pydantic>=2.10",
    "typer>=0.15",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "mplfinance>=0.12.10b0",
    "exchange-calendars>=4.6",
    "python-dotenv>=1.0",
]

[project.scripts]
qms = "qms.cli:app"
pass2 = "qms.pass2.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
